; ⚠️ 本文件是**唯一生效**的 pytest 配置（pytest 配置优先级：pytest.ini >
; pyproject.toml > tox.ini > setup.cfg）。此前 pyproject.toml 里还有一段
; [tool.pytest.ini_options]，那段从未生效，却包含 marker 与 filterwarnings ——
; 于是"以为已忽略的弃用告警"一直在刷屏。2026-09-19 已把那段并入本文件并删除死段。
[pytest]
asyncio_mode = auto
testpaths = tests mcp-extension/test compiler/test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
; P1-E: 由配置统一注入项目根，新测试文件不必再写 sys.path.insert
; （历史遗留的 283 处插入已由 tests/conftest.py 的收集后去重合入无害，
;   见 tests/test_syspath_hygiene.py 的防回涨闸门）
pythonpath = .
markers =
    real_ffmpeg: 需要真实 ffmpeg 二进制的端到端用例（无 ffmpeg 时自动跳过）
    slow: 耗时较长的用例（真实转码/渲染等）
    integration: 集成测试
    real_ae: 需要真实 AE 环境的测试
    silhouette: 需要 Silhouette 环境的测试
; 由死配置段合并而来（项目原意：测试输出不被弃用告警刷屏）
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
