name: Quality Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality-gate:
    # 管线产物质量门：合成素材 → UnifiedPipeline v2 → QualityGate 判定
    # 在 GitHub 仓库 Settings → Branches → Branch protection 中将本 job 设为
    # required check，PR 质量不达标即无法合并。
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[audio,video,vision]" requests

      - name: Run E2E pipeline (synthetic materials, no LLM key needed)
        env:
          AEK_ENVIRONMENT: test
        run: |
          python scripts/ci_e2e_pipeline.py --output-dir output/ci/e2e

      - name: Run Quality Gate
        run: |
          python scripts/ci_quality_gate.py --result output/ci/e2e/latest_pipeline_result.json --thresholds config/quality_gate_thresholds.json --report output/ci/quality_gate_report.json

      - name: Upload quality gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: |
            output/ci/*.json
            output/ci/*.log
          if-no-files-found: warn

  unit-tests:
    # 离线单元测试门（P0-3）：锁定 Phase 0-3 已交付的风格复制管线。
    # 仅跑 tests/test_style_copy_pipeline.py；其默认 addopts 排除 real_ffmpeg/slow，
    # CI 中只执行 7 个纯 Python 离线用例，无需 AE/ffmpeg/重型依赖，确定性通过。
    # 真实 ffmpeg 回归（real_ffmpeg 标记）在本地 `pytest -m real_ffmpeg` 执行。
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout requests

      - name: Run offline unit tests
        env:
          AEK_ENVIRONMENT: test
        run: |
          python -m pytest tests/test_style_copy_pipeline.py -q
