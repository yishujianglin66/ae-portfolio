[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ae-knowledge-vault"
version = "1.0.0"
description = "AE 自动化管线 — 感知→理解→规划→执行→反馈 五层架构"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AE-Knowledge-Vault Team"},
]
keywords = ["after-effects", "automation", "pipeline", "silhouette", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries",
]

# 运行时核心依赖
dependencies = [
    "numpy>=1.24,<2.1",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
# 音频分析
audio = [
    "librosa>=0.10",
    "soundfile>=0.12",
]
# 视频感知
vision = [
    "opencv-python>=4.8",
    "scenedetect[opencv]>=0.6.4",
]
# 视频处理
video = [
    "ffmpeg-python>=0.2",
    "moviepy>=1.0",
]
# AI/ML
ai = [
    "openai>=1.0",
    "scikit-learn>=1.3",
]
# 素材下载
download = [
    "yt-dlp>=2024.0",
    "requests>=2.31",
]
# Web Dashboard
web = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "websockets>=12.0",
]
# 开发工具
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",     # A4: 全量测试分片并行(CI 强制门)
    "flake8>=6.1",
    "mypy>=1.7",             # A2: 渐进类型检查(beachhead→core)
    "ruff>=0.16",            # A1: advisory profile(ruff-advisory.toml)
    "pip-audit>=2.7",        # A3: 依赖漏洞扫描(OSV)
    "httpx>=0.25",
]
# 开源项目集成 (GitHub顶级开源项目)
opensource = [
    "openai-whisper>=20231117",
    "faster-whisper>=1.0",
    "moviepy>=1.0",
]
# 性能增强
performance = [
    "numba>=0.58",
    "rich>=13.0",
    "tqdm>=4.66",
]
# 全部安装
all = [
    "ae-knowledge-vault[audio,vision,video,ai,download,web,dev,opensource,performance]",
]

[project.urls]
Homepage = "https://github.com/ae-knowledge-vault/ae-knowledge-vault"
Documentation = "https://github.com/ae-knowledge-vault/ae-knowledge-vault/docs"
Issues = "https://github.com/ae-knowledge-vault/ae-knowledge-vault/issues"

[project.scripts]
ae-pipeline = "ae_agent_pipeline:main"
ae-mcp-listener = "ae_mcp_listener:main"

# ============================================================
# setuptools 配置
# ============================================================
[tool.setuptools]
# 根目录模块 + 子包
py-modules = [
    "ae_agent_pipeline",
    "ae_mcp_client",
    "ae_bridge_base",
    "ae_command_generator",
    "ae_ts_compiler_client",
    "effect_composer",
    "effect_name_map",
    "transition_map",
    "expression_library",
    "scene_3d_orchestrator",
    "layer_orchestrator",
    "scene_orchestrator",
    "beat_orchestrator",
    "nlu_parser",
    "intent_router",
    "clarification_engine",
    "parameter_optimizer",
    "parameter_mapper",
    "silhouette_executor",
    "learning_loop",
    "persistent_learning_loop",
    "result_verifier",
    "failure_recovery",
    "report_to_ops",
    "vocabulary_map",
    "ai_scheduler",
    "feedback_loop_manager",
    # Phase 2 感知层增强模块
    "scene_detector",
    "audio_analyzer_librosa",
    "media_preprocessor",
    # 木偶风格化模块
    "puppet_style_engine",
    "puppet_auto_processor",
    "puppet_workflow_orchestrator",
    "mediapipe_integration",
    # 集成模块
    "adobe_suite_integration",
    "davinci_resolve_integration",
    "blender_3d_integration",
    "topaz_integration",
    "ai_video_generator",
    # 工具模块
    "logger",
    # 企业级架构模块
    "batch_queue",
    "task_persistence",
    "resource_manager",
    "workflow_batch_integration",
    "api_server",
    "exceptions",
    "config_schema",
    "video_quality_assessor",
    "parameter_optimizer",
    # 开源项目集成
    "opensource_integrations",
    # 统一多工具集成
    "unified_tool_integrator",
]
packages = ["core", "config", "puppet_effects", "performance", "vrs", "software_sdk"]

# ============================================================
# pytest 配置 —— 已迁移至 pytest.ini（2026-09-19）
# ============================================================
# 此处原有一段 [tool.pytest.ini_options]，但它**从未生效**：pytest 的配置优先级
# 是 pytest.ini > pyproject.toml > tox.ini > setup.cfg，而仓库根存在 pytest.ini。
# 死段的实际代价：里面写的 markers 与 filterwarnings（忽略弃用告警）都不起作用 ——
# 测试输出因此长期被弃用告警刷屏，而维护者以为自己已经关掉了。
# 现所有 pytest 配置统一写在 pytest.ini；防回涨闸门见
# tests/test_syspath_hygiene.py::test_no_dead_pytest_config_in_pyproject。

# ============================================================
# 覆盖率配置
# ============================================================
[tool.coverage.run]
# T0.2 修复(2026-09-14, 审计发现 C3): 原 source 只列 ~17 个根模块, 遗漏代码主体
# (core/ai/pipeline/integrations/agents, 含全部 god 文件) → 主体覆盖率从未被测量。
# 现纳入核心库主包; scripts/(553 个 CLI 入口/一次性脚本)不计入单元覆盖, 由 e2e/集成测试覆盖。
# 现状(2026-09-20 校正): pytest-cov 已就绪, 且 **coverage 已由 CI 强制执行** ——
# .github/workflows/quality-hardening.yml 的 full-suite-sharded 作业会跑
# `--cov --cov-fail-under=29`（该作业当前 continue-on-error: true，即"观察期"，
# 连续两周绿后转 required）。原注释"未装/未被任何 CI 强制执行"已过时。
source = [
    "core",
    "ai",
    "pipeline",
    "integrations",
    "agents",
    "ae_agent_pipeline",
    "ae_mcp_client",
    "effect_composer",
    "transition_map",
    "expression_library",
    "scene_3d_orchestrator",
    "layer_orchestrator",
    "learning_loop",
    "result_verifier",
    "failure_recovery",
    "report_to_ops",
    "intent_router",
    "nlu_parser",
    "silhouette_executor",
    "scene_detector",
    "audio_analyzer_librosa",
    "media_preprocessor",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/test_*.py",
    "*/conftest.py",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
# ratchet 地板 = 29。单一真相源就是本字段：CI 传的 `--cov-fail-under=29` 与它一致。
# 2026-09-20 修正: 原值写成 35（与同段注释"设 29 为地板"及 CI 命令**互相矛盾**）。
# 因 CLI 覆盖配置，CI 行为一直正确，但**本地不带 flag 跑 --cov 会被 35 卡红**；
# 而实测覆盖约 32-33%，不到 35 → 本地假红。故把字段改回 29 与注释/CI 对齐。
# 实测基线(2026-09-14, 全量5503passed/7failed/18分): 29.70%(77189语句/52551未覆盖, --branch)。
# 逐步上调: 补测后同步上调本值（改一处即同时约束 CI 与本地）。
# ⚠️ god 文件曾几乎零覆盖(filter_engine/transition_engine/text_animation_engine=0%,
# production_director=10%) → 分解前必须先补 characterization 测试。
#    2026-09-22 现状: filter_engine 51% / transition_engine 41% / text_animation 42%
#    (特征化测试补齐后), production_director 14%(助手层已测, 剩余需整链集成)。
# 水位(2026-09-22, 6106 passed / 0 failed): **34.18%**, 距本地板余量 ~5.2pp。
# 补测的方法与坑(噪声带/先比断言/枚举身份) 见 docs/contributing.md §三。
fail_under = 29

# ============================================================
# flake8 配置 (通过 setup.cfg 或 .flake8)
# ============================================================
[tool.flake8]
max-line-length = 120
extend-ignore = ["E501", "W503", "E203"]
exclude = [
    ".git",
    "__pycache__",
    "node_modules",
    ".obsidian",
    "build",
    "dist",
]

# ============================================================
# mypy 配置
# ============================================================
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true  # 2026-09-19 升级：严格类型检查，推动 any 类型减少 50%
