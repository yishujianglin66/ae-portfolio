# ruff 基线配置（E0-5b，2026-09-05）
# 策略：先只拦截"代码根本跑不了"级别的问题（语法错误/未定义名称），
#       让闸门即刻可用且绿色；后续按模块逐步收紧规则（E1-6）。
target-version = "py311"
line-length = 120
extend-exclude = [
    "external",
    "openspec",
    "tmp",
    "test_output_opensource",
    ".workbuddy",
]

[lint]
select = [
    "E9",   # 语法错误
    "F7",   # 语法错误 in 断言
    "F63",  # 无效比较/赋值
    "F82",  # 未定义名称
    "F821", # 未定义名称（显式）
    "F823", # 局部变量在赋值前被引用
]

[lint.per-file-ignores]
# vendored / 历史脚本不设限
"archive/**" = ["E9", "F7", "F63", "F82", "F821", "F823"]
"mcp-extension/**" = ["E9", "F7", "F63", "F82", "F821", "F823"]

